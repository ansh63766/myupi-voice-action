# config.yaml — MyUPI Voice+Action Prototype

llm:
  provider: openai_compatible          
  base_url: http://14.195.12.18:9597/v1
  model: /model
  api_key: "axelblaze"
  temperature: 0.1
  max_tokens: 2048
  timeout_s: 30

asr:
  provider: indic_transcribe
  model: bodhan-ai/indic-transcribe-flex
  device: cuda


vad:
  provider: silero
  threshold: 0.5
  min_speech_duration_ms: 250
  max_silence_duration_ms: 700

fuzzy:
  provider: rapidfuzz
  resolve_threshold: 85
  disambiguate_threshold: 60
  max_candidates: 5

db:
  provider: sqlite
  url: sqlite+aiosqlite:///./data/myupi.db

audio:
  sample_rate: 16000
  channels: 1
  max_utterance_s: 15
  format: wav

session:
  max_voice_retries: 3
  slot_fill_max_attempts: 3

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
